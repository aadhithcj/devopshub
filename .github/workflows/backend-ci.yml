name: DevOpsHub CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - "ci/**"

  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/test_app.py

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devopshub-backend:latest \
            ./backend

      - name: Run Docker container
        run: |
          docker run -d \
            --name devopshub-backend-test \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }}

      - name: Test Docker container
        run: |
          sleep 3
          curl --fail http://localhost:5000/api/health

      - name: Stop Docker container
        if: always()
        run: docker stop devopshub-backend-test

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devopshub-backend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy backend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }}

        run: |
          set -eu

          # Validate required secrets without printing their values.
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Validate the private key.
          ssh-keygen -y -f ~/.ssh/ec2_key >/dev/null

          # Add the server host key for this connection.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Deploy the image on EC2.
          ssh -i ~/.ssh/ec2_key \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -eu

          cd "$HOME/devopshub"

          # Confirm the database container and network exist.
          docker network inspect devopshub >/dev/null
          docker inspect devopshub-db >/dev/null

          # Remember the currently deployed image for rollback.
          OLD_IMAGE=$(docker inspect \
            --format '{{.Config.Image}}' devopshub-backend)

          # Download the new image before stopping the existing backend.
          docker pull "$IMAGE"

          # Stop and remove the old container to free port 5000.
          docker rm -f devopshub-backend

          # Start the new version with the existing server-side environment.
          if ! docker run -d \
            --name devopshub-backend \
            --network devopshub \
            --restart unless-stopped \
            --env-file "$HOME/devopshub/.env" \
            -p 5000:5000 \
            "$IMAGE"; then

            echo "New container failed to start. Attempting rollback."

            docker rm -f devopshub-backend 2>/dev/null || true

            docker run -d \
              --name devopshub-backend \
              --network devopshub \
              --restart unless-stopped \
              --env-file "$HOME/devopshub/.env" \
              -p 5000:5000 \
              "$OLD_IMAGE"

            exit 1
          fi

          # Wait up to 60 seconds for the API to become healthy.
          for attempt in $(seq 1 20); do
            if curl --fail --silent \
              http://localhost:5000/api/health >/dev/null; then

              echo "Deployment health check passed."
              docker ps --filter name=devopshub-backend
              exit 0
            fi

            sleep 3
          done

          # If health checks fail, restore the previous image.
          echo "Health check failed. Attempting rollback."

          docker logs --tail 50 devopshub-backend || true
          docker rm -f devopshub-backend 2>/dev/null || true

          docker run -d \
            --name devopshub-backend \
            --network devopshub \
            --restart unless-stopped \
            --env-file "$HOME/devopshub/.env" \
            -p 5000:5000 \
            "$OLD_IMAGE"

          exit 1
          REMOTE