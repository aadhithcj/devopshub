name: DevOpsHub CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "ci/**"

  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/test_app.py

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devopshub-backend:latest \
            ./backend

      - name: Run Docker container
        run: |
          docker run -d \
            --name devopshub-backend-test \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }}

      - name: Test Docker container
        run: |
          sleep 3
          curl --fail http://localhost:5000/api/health

      - name: Stop Docker container
        if: always()
        run: docker stop devopshub-backend-test 2>/dev/null || true

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devopshub-backend:latest

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      
      - name: Deploy backend through SSM
        shell: bash
        env:
          EC2_INSTANCE_ID: i-0907040bbc5d92f02
          IMAGE: ghcr.io/${{ github.repository_owner }}/devopshub-backend:${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          aws sts get-caller-identity >/dev/null

          # Create the remote script without a nested heredoc.
          DEPLOY_SCRIPT=$(printf '%s\n' \
            'set -eu' \
            'DEPLOY_HOME="/home/ubuntu/devopshub"' \
            'cd "$DEPLOY_HOME"' \
            'docker network inspect devopshub >/dev/null' \
            'docker inspect devopshub-db >/dev/null' \
            'test -f "$DEPLOY_HOME/.env"' \
            'test -n "${IMAGE:?Deployment image is missing}"' \
            'OLD_IMAGE=$(docker inspect --format "{{.Config.Image}}" devopshub-backend)' \
            'docker pull "$IMAGE"' \
            'docker rm -f devopshub-backend' \
            'if ! docker run -d --name devopshub-backend --network devopshub --restart unless-stopped --env-file "$DEPLOY_HOME/.env" -p 5000:5000 "$IMAGE"; then' \
            '  echo "Container startup failed. Attempting rollback."' \
            '  docker rm -f devopshub-backend 2>/dev/null || true' \
            '  docker run -d --name devopshub-backend --network devopshub --restart unless-stopped --env-file "$DEPLOY_HOME/.env" -p 5000:5000 "$OLD_IMAGE"' \
            '  exit 1' \
            'fi' \
            'for attempt in $(seq 1 20); do' \
            '  if curl --fail --silent http://localhost:5000/api/health >/dev/null && curl --fail --silent http://localhost:5000/api/db-health >/dev/null; then' \
            '    echo "Application and database health checks passed."' \
            '    docker ps --filter name=devopshub-backend' \
            '    exit 0' \
            '  fi' \
            '  sleep 3' \
            'done' \
            'echo "Health checks failed. Attempting rollback."' \
            'docker logs --tail 50 devopshub-backend || true' \
            'docker rm -f devopshub-backend 2>/dev/null || true' \
            'docker run -d --name devopshub-backend --network devopshub --restart unless-stopped --env-file "$DEPLOY_HOME/.env" -p 5000:5000 "$OLD_IMAGE"' \
            'for attempt in $(seq 1 20); do' \
            '  if curl --fail --silent http://localhost:5000/api/health >/dev/null && curl --fail --silent http://localhost:5000/api/db-health >/dev/null; then' \
            '    echo "Rollback successful; previous version is healthy."' \
            '    exit 1' \
            '  fi' \
            '  sleep 3' \
            'done' \
            'echo "CRITICAL: Rollback health checks failed."' \
            'docker logs --tail 50 devopshub-backend || true' \
            'exit 1')

          # Pass IMAGE explicitly; SSM runs commands as root.
          DEPLOY_SCRIPT="IMAGE='$IMAGE"$'\n'"$DEPLOY_SCRIPT"

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "DevOpsHub deployment ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json || true
                exit 1
                ;;
              *)
                echo "SSM status: ${STATUS:-Pending}; waiting..."
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for SSM command completion."
          exit 1
