services:
  postgres:
    image: postgres:16
    container_name: devopshub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devopshub
      POSTGRES_USER: devopshub
      POSTGRES_PASSWORD: devopshub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: